{% extends "layout.html" %} {% block content %}
<h1>Log in</h1>
<form id="login-form">
  <label for="email">Email</label>
  <input id="email" name="username" type="email" required />
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required />
  <button type="submit">Log in</button>
</form>
<p id="form-error" hidden></p>
<p>No account yet? <a href="{{ url_for('register_page') }}">Register</a></p>

<script type="module">
  import { getErrorMessage } from "{{ url_for('static', path='js/utils.js') }}";
  import { setToken } from "{{ url_for('static', path='js/auth.js') }}";

  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("form-error");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const response = await fetch("/api/users/token", {
      method: "POST",
      body: new FormData(form), // form data, not JSON: OAuth2PasswordRequestForm
    });

    if (response.ok) {
      const data = await response.json();
      setToken(data.access_token);
      window.location.href = "{{ url_for('home') }}";
    } else {
      errorBox.textContent = getErrorMessage(await response.json());
      errorBox.hidden = false;
    }
  });
</script>
{% endblock %}
